name: build-index

# packs/ 가 바뀌면 manifest 를 검사하고 index.json(파일 목록·sha256)을 다시 만들어 커밋
on:
  push:
    branches: [main]
    paths: ['packs/**', 'tools/**']
  pull_request:
    paths: ['packs/**', 'tools/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # PR 은 검사만 (index.json 을 직접 갱신해서 올렸는지 확인)
      - if: github.event_name == 'pull_request'
        run: node tools/build-index.mjs --check
      - if: github.event_name != 'pull_request'
        run: |
          node tools/build-index.mjs
          if git diff --quiet -- index.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Rebuild index.json"
          git push
