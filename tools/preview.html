<!doctype html>
<!-- 팩 미리보기: 레포 루트에서 `python -m http.server 8790` 실행 후
     http://localhost:8790/tools/preview.html?pack=<id> 로 연다. (앱 없이 장면만 확인) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>팩 미리보기</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Malgun Gothic", sans-serif; }
  #stage { position: absolute; inset: 0; }
  #pet { position: absolute; bottom: 3.9%; left: 46%; width: 4.5%; height: 9%; border: 2px dashed rgba(255,255,255,.6);
         border-radius: 6px; color: #fff; font-size: 12px; display: grid; place-items: center; pointer-events: none; z-index: 5; }
  #bar { position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; gap: 6px; flex-wrap: wrap; max-width: 90%; }
  #bar button, #bar select { background: rgba(20,20,35,.8); color: #eee; border: 1px solid #556; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  #err { position: absolute; bottom: 10px; left: 10px; color: #f88; z-index: 10; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="pet">펫</div>
<div id="bar"></div>
<div id="err"></div>
<script>
  const id = new URLSearchParams(location.search).get('pack') || 'fantasy-skies';
  const base = `../packs/${id}/`;
  const W = 1920, H = 1080;                    // 앱의 설계 해상도와 같게
  const mouse = { x: W / 2, y: H / 2, normX: 0.5, normY: 0.5 };
  const defs = {};
  const pet = { x: 0.46, dir: 1, wait: 0 };
  window.LiveWallpaperScenes = { register(def) { defs[def.id] = def; } };
  addEventListener('mousemove', e => { mouse.normX = e.clientX / innerWidth; mouse.normY = e.clientY / innerHeight; mouse.x = mouse.normX * W; mouse.y = mouse.normY * H; });
  const show = msg => document.getElementById('err').textContent = msg;
  addEventListener('error', e => show(e.message));

  fetch(base + 'manifest.json').then(r => r.json()).then(m => {
    document.title = `미리보기 — ${m.title}`;
    const s = document.createElement('script');
    s.src = base + (m.entry || 'scene.js') + '?t=' + Date.now();
    s.onload = () => start(m);
    document.head.appendChild(s);
  }).catch(e => show(String(e)));

  function start(m) {
    const root = document.getElementById('stage');
    const inst = defs[m.id].create({ root, manifest: m, mouse, get w() { return W; }, get h() { return H; },
      asset: p => base + String(p).split('/').map(encodeURIComponent).join('/'),
      pets: () => [{ x: (pet.x + 0.0225) * W, y: H * 0.95 }] });   // 펫 위치(설계 좌표) — 앱의 펫 대신 걷는 자리 표시
    const bar = document.getElementById('bar');
    for (const a of m.actions || []) {
      const b = document.createElement('button'); b.textContent = a.label;
      b.onclick = e => { e.stopPropagation(); inst.action?.(a.id); };
      bar.appendChild(b);
    }
    const f = document.createElement('select');
    [['none', '색감 없음'], ['sepia(0.4) saturate(1.2)', '세피아'], ['hue-rotate(40deg)', '색상 회전'], ['grayscale(1)', '흑백']]
      .forEach(([v, t]) => f.add(new Option(t, v)));
    f.onclick = e => e.stopPropagation();
    f.onchange = () => inst.setFilter?.(f.value);
    bar.appendChild(f);
    const petBtn = document.createElement('button'); petBtn.textContent = '펫 자리 표시';
    petBtn.onclick = e => { e.stopPropagation(); const p = document.getElementById('pet'); p.style.display = p.style.display === 'none' ? '' : 'none'; };
    bar.appendChild(petBtn);
    addEventListener('click', () => inst.click?.());
    const petEl = document.getElementById('pet');
    const walkPet = () => {   // 펫 자리 표시가 좌우로 걷다가 가끔 멈춤
      if (pet.wait > 0) { pet.wait--; } else { pet.x += pet.dir * 0.0009; if (pet.x > 0.9 || pet.x < 0.05) pet.dir *= -1; if (Math.random() < 0.003) pet.wait = 120 + Math.random() * 180; }
      petEl.style.left = (pet.x * 100) + '%';
    };
    const loop = t => { try { walkPet(); inst.frame?.(t); } catch (e) { show('frame: ' + e.message); console.error(e); return; } requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    window.__inst = inst;
  }
</script>
</body>
</html>
